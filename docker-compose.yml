services:
  web:
    build: .
    container_name: tarefas_app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5000:5000"
    volumes:
      # Persistir banco de dados
      - ./data:/app/data
    # Toda a configuração vem do .env, que é a única fonte. Copie o
    # .env.example, que já vem com valores de produção, e ajuste o que precisar.
    # O compose falha se o arquivo não existir.
    env_file: .env
    environment:
      # Única exceção: este caminho descreve a estrutura da imagem, não uma
      # escolha de quem instala. É absoluto e aponta para o volume montado em
      # data/; um caminho relativo cairia em /app/instance e os dados se
      # perderiam ao recriar o contêiner. Definido aqui, prevalece sobre o
      # DATABASE_URL do .env, que serve para rodar fora do contêiner.
      - DATABASE_URL=sqlite:////app/data/tarefas.db
    healthcheck:
      # A imagem python:slim não traz curl; usa-se o próprio Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
