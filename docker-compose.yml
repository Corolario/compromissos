services:
  web:
    build: .
    container_name: tarefas_app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5000:5000"
    volumes:
      # Persistir banco de dados
      - ./data:/app/data
    environment:
      # Sem valor padrão de propósito: uma SECRET_KEY conhecida permite forjar
      # sessões e entrar como qualquer usuário. O compose falha se não estiver
      # definida no .env.
      - "SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no arquivo .env - gere com python3 -c 'import secrets; print(secrets.token_hex(32))'}"
      - DATABASE_URL=sqlite:////app/data/tarefas.db
      - FLASK_ENV=${FLASK_ENV:-production}
      # Em produção o Flask-Talisman já força HTTPS, então os cookies e a
      # validação de origem do CSRF assumem TLS. Ajuste no .env apenas se
      # estiver rodando sem HTTPS.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - WTF_CSRF_SSL_STRICT=${WTF_CSRF_SSL_STRICT:-True}
      # Quantos proxies reversos existem na frente da aplicação. Necessário
      # para que o limite de tentativas de login enxergue o IP real do
      # visitante. Deixe 0 se a porta 5000 for acessada diretamente.
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-0}
      # Armazenamento do contador de tentativas. Em memória cada worker conta
      # separadamente; aponte para um Redis se quiser um limite exato.
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-memory://}
    healthcheck:
      # A imagem python:slim não traz curl; usa-se o próprio Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
